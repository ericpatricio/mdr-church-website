name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Website and Studio validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pull-request merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build website
        run: npm run build

      - name: Validate static website
        run: npm run check

      - name: Test website and CMS adapter
        run: npm test

      - name: Install locked Studio dependencies without lifecycle scripts
        working-directory: studio
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Type-check Studio
        working-directory: studio
        run: npm run typecheck

      - name: Test Studio components and dependency compatibility
        working-directory: studio
        run: npm test
